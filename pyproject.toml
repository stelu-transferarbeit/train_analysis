[project]
name = "train-analysis"
version = "0.1.0"
description = "Train popularity in Europe: what are the main factors?"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Stéphane Bisinger", email = "stephane@sbisinger.ch" },
  { name = "Luca Pellegrini", email = "luca9294@hotmail.it" }
]
dependencies = [
  "cyclopts>=4.22.5",
  "jupyter>=1.1.1",
  "jupyterlab>=4.5.8",
  "linearmodels>=7.0",
  "matplotlib>=3.11.0",
  "pandas>=3.0.3",
  "pandas-stubs>=3.0.3.260530",
  "pyarrow>=25.0.1",
  "scikit-learn>=1.9.0",
  "seaborn>=0.13.2",
  "statsmodels>=0.15.0",
]
[project.scripts]
stelu = "train_analysis:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.basedpyright]
venv = ".venv"
venvPath = "."
reportAny = false

[tool.pyright]
venv = ".venv"
venvPath = "."
